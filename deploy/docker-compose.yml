services:
  finch-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: finchspeak-server:latest
    container_name: finch-server
    restart: unless-stopped
    ports:
      # Change the left side if another program already uses these ports on the host;
      # clients then connect to https://<host>:<new TCP port>.
      - "4433:4433/udp"
      - "8443:8443/tcp"
    volumes:
      # A named volume keeps the database, certificate (its fingerprint), uploads, backups
      # and logs across restarts and image updates, writable by the unprivileged server user.
      - finch-data:/app/data
      - ./finch-server.toml:/app/finch-server.toml:ro
    environment:
      - RUST_LOG=info,finch_server=info
    # The server needs about 50 MB; the limit keeps it from starving other programs.
    mem_limit: 512m
    # Container output is capped at 30 MB; the server keeps its own rotated logs in the volume.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  finch-data:
