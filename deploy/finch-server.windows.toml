# FinchSpeak server settings (copy of finch-server.toml.example; the server reads
# finch-server.toml from the folder it is started in). Everything is optional.

[server]
host = "0.0.0.0"
quic_port = 4433      # UDP, voice and video
http_port = 8443      # TCP, HTTPS (login, history, files)
# Browser origins allowed to call the HTTP API (CORS), besides the desktop app's own
# (tauri://localhost, http(s)://tauri.localhost). Example: ["https://finch.example.com"]. Default: none.
# allowed_origins = []

[storage]
max_file_size_mb = 50
# Per-user upload limits: total size of one user's files, and uploads per minute (defaults: 1024 MB, 30).
# user_quota_mb = 1024
# uploads_per_minute = 30

[auth]
# "invite": people register with a code from an admin (the first account on an empty
# server becomes the admin). "open": anyone who can reach the server may register.
registration = "invite"
token_expiry_hours = 720

[backup]
enabled = true
dir = "./data/backups"
interval_hours = 24
keep = 7              # newest copies kept

[logging]
dir = "./data/logs"
keep_files = 14       # daily files kept

# Media rate limits per participant: the SFU drops (and counts in the health panel) media above them.
# Defaults: 12 Mbit/s with a 1 MB burst, and 2000 datagrams per second.
# [limits]
# media_bytes_per_sec = 1500000
# media_burst_bytes = 1048576
# media_packets_per_sec = 2000
# media_keyframe_bytes_per_sec = 1000000
# Sign-in gate: a new connection must sign in within preauth_timeout_secs seconds. One address may
# hold preauth_per_ip connections that have not signed in yet, and the server preauth_total in all.
# Defaults: 10 seconds, 8 per address, 256 in total.
# preauth_timeout_secs = 10
# preauth_per_ip = 8
# preauth_total = 256
# Argon2 password hashes or checks running at once (each needs about 19 MiB). Sign-ins wait their turn; default 2, at least 1.
# auth_hash_concurrency = 2
