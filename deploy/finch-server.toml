[server]
host = "0.0.0.0"
quic_port = 4433
http_port = 8443
# Persistent TLS certificate (keeps the fingerprint clients pinned).
tls_dir = "/app/data/tls"

[database]
url = "sqlite:///app/data/finchspeak.db?mode=rwc"

[storage]
upload_dir = "/app/data/uploads"
max_file_size_mb = 50

[auth]
# Leave jwt_secret unset: a random secret is generated on first start and kept in
# jwt_secret_file (inside the data volume), so tokens survive restarts.
# To use your own, uncomment and set a long random value:
# jwt_secret = "..."
jwt_secret_file = "/app/data/jwt_secret"
token_expiry_hours = 72
# Who may register: "invite" (default; an admin creates codes in the app) or "open".
# The very first account on an empty server is always allowed and becomes the admin.
registration = "invite"
