# FinchSpeak Server Configuration

[server]
host = "0.0.0.0"
quic_port = 4433
http_port = 8443          # HTTPS REST (TLS only)
tls_dir = "./data/tls"    # persistent certificate; clients pin its fingerprint

[database]
url = "sqlite://finchspeak.db?mode=rwc"

[storage]
upload_dir = "./data/uploads"
max_file_size_mb = 50

[auth]
# No jwt_secret here: a random one is generated on first start and kept in jwt_secret_file.
jwt_secret_file = "./data/jwt_secret"
jwt_expiration_hours = 72
