[workspace]
resolver = "2"
members = [
    "crates/finch-protocol",
    "crates/finch-server",
    "crates/finch-audio",
    "crates/finch-screen",
    "crates/finch-client-core",
    "crates/finch-testbed",
    "app",
]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT"
authors = ["FinchSpeak Contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# QUIC
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# Identity
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Bytes
bytes = "1"

# Internal crates
finch-protocol = { path = "crates/finch-protocol" }
finch-audio = { path = "crates/finch-audio" }
finch-screen = { path = "crates/finch-screen" }
finch-client-core = { path = "crates/finch-client-core" }

# Full debug info made target/ 86 GB (29 GB of PDBs for ~35 test executables that each link the
# whole stack). Line tables keep backtraces readable; dependencies need no debug info at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
