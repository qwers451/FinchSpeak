[package]
name = "finch-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FinchSpeak desktop client (Tauri v2)"

[dependencies]
finch-protocol = { workspace = true }
finch-audio = { workspace = true }
finch-screen = { workspace = true }
finch-client-core = { workspace = true }

# Tauri v2
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
minisign-verify = "0.2"
url = "2"
base64 = "0.22"

# Async & QUIC
tokio = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
ring = "0.17"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }

# Concurrency
dashmap = "6"

# Audio I/O
cpal = "0.15"
ringbuf = "0.5"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

[features]
# Serve the bundled frontend instead of the dev server (set by `tauri build`).
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "finch_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "finch-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dev-dependencies]
finch-testbed = { path = "../crates/finch-testbed" }

