[package]
name = "finch-screen"
description = "Screen capture and video encoding for FinchSpeak"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
finch-protocol = { workspace = true }

# Screen capture
xcap = "0.1"

# Previews of screens and windows
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# H.264 codec
openh264 = "0.9"

# Audio loopback and Opus encoding
cpal = "0.15"
audiopus = "0.3.0-rc.0"
ringbuf = "0.5"

# Logging
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Bytes
bytes = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_SystemInformation", "Wdk_System_SystemServices"] }
windows-core = "0.62"

