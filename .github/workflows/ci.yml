name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: target/native-cache
          key: native-release-v2-${{ runner.os }}-${{ env.VCToolsVersion }}-${{ hashFiles('native/webrtc/dependencies.lock.json', 'scripts/prepare-webrtc.ps1', 'native/webrtc/meson.build') }}
      - name: Prepare and verify original C++ audio
        shell: pwsh
        run: |
          ./scripts/prepare-webrtc.ps1 -Configuration Release
          "FINCH_WEBRTC_ROOT=$env:FINCH_WEBRTC_ROOT" >> $env:GITHUB_ENV
          ./native/webrtc/probe/prepare-tests.ps1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Frontend tests
        working-directory: app/frontend
        run: npm test

      - name: Frontend type check and build
        working-directory: app/frontend
        run: npm run build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        # DSP/metric tests must not steal CPU from wall-clock audio latency checks.
        run: cargo test --workspace -- --test-threads=1
        env:
          RUST_BACKTRACE: 1
